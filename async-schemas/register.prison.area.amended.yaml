name: register.prison.area.amended
title: register.prison.area.amended
summary: A prison area has been updated
description: |
  Published when a prison's area, region, geographical area, payroll region, local authority
  or CJIT code changes in DPS. This is the only prison change that is sent to NOMIS.
contentType: application/json
payload:
  type: object
  required: [additionalInformation, description, eventType, occurredAt, version]
  properties:
    additionalInformation:
      $ref: ./register.additional-information.yaml#/prison
    description:
      type: string
      const: A prison area has been updated
    eventType:
      type: string
      const: register.prison.area.amended
    occurredAt:
      type: string
      description: The date and time the event occurred
      format: date-time
    version:
      type: integer
      description: Version of this event message. Currently 1
