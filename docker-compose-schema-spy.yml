services:
  # Postgres must listen on the standard 5432 rather than a random Testcontainers port. PostgresContainer
  # uses an already-running database when 5432 is taken (see isPostgresRunning), so InitialiseDatabase
  # migrates *this* container and SchemaSpy can then read the same schema. Left to Testcontainers, the
  # schema would be built in a throwaway container that stops with the JVM.
  postgres:
    image: postgres:18
    networks:
      - hmpps
    container_name: prison-register-schema-spy-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=prison-register
      - POSTGRES_USER=prison-register
      - POSTGRES_PASSWORD=prison-register
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prison-register", "-d", "prison-register"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The test starts the full Spring context, which wires HmppsQueueService, and IntegrationTestBase
  # purges a test queue before each test. Without SQS/SNS on 4566 the context fails to start, Flyway
  # never runs and SchemaSpy has no schema to read.
  localstack:
    image: localstack/localstack:4
    networks:
      - hmpps
    container_name: prison-register-schema-spy-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sns,sqs
      - DEFAULT_REGION=eu-west-2
    healthcheck:
      test: ["CMD", "bash", "-c", "awslocal sns list-topics && awslocal sqs list-queues"]
      interval: 5s
      timeout: 10s
      retries: 20

networks:
  hmpps:
