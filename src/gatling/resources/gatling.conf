# Settings for the load test in src/gatling (MAPB-1129). See docs/load-test.md.
gatling {
  charting {
    indicators {
      # Response time bands shown in the report, in milliseconds
      lowerBound = 50
      higherBound = 200
    }
  }
  data {
    # Do not send anonymous usage figures to Gatling
    enableAnalytics = false
    console {
      # Print overall progress every 30 seconds, not every endpoint every 5 seconds. The report
      # has the figures for each endpoint.
      light = true
      writePeriod = 30
    }
  }
}
